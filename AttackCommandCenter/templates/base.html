<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ACC{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .glass {
            background: rgba(26, 26, 35, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 204, 0.15);
        }
        .glass:hover {
            border-color: rgba(0, 255, 204, 0.4);
        }
        .vuln-badge {
            background: rgba(255, 51, 102, 0.2);
            color: #ff3366;
            border: 1px solid rgba(255, 51, 102, 0.3);
        }
    </style>
</head>
<body class="text-gray-200">
    <nav class="border-b border-[#00ffcc]/30 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-8">
                    <a href="/" class="text-xl font-bold tracking-wider text-[#00ffcc] font-mono">ACC</a>
                    <div class="flex gap-4">
                        <a href="/acc" class="hover:text-[#00ffcc] transition">🔓 ACC</a>
                        <a href="/reports" class="hover:text-[#00ffcc] transition">📊 Attack Reports</a>
                    </div>
                </div>
                <div>
                    {% if session.username %}
                        <span class="text-sm text-gray-400">👤 {{ session.username }}</span>
                        <a href="/logout" class="ml-4 text-sm text-[#ff3366] hover:underline">Logout</a>
                    {% else %}
                        <a href="/login" class="text-sm text-[#00ffcc] hover:underline">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
